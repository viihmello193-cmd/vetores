<script>
    let vetorA = [];

    for(let i=0; i<10; i++){
        vetorA[i] = parseInt(prompt("Entre com o "+(i+1)+"º valor de A:"));
    }

    let vetorB = [];

    for(let i=0; i<10; i++){
        vetorB[i] = vetorA[9-i];
    }

    document.write("Vetor A: "+vetorA+"<br>");
    document.write("Vetor B: "+vetorB);
</script>
